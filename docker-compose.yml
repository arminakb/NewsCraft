services:
  postgres:
    image: postgres:18.3-bookworm@sha256:80630f83606d8db77d30b3851b16a9f78be2d0d4dda6f7b82a1fdca5ebe3acba
    restart: "no"
    environment:
      POSTGRES_USER: newscraft
      POSTGRES_PASSWORD: newscraft
      POSTGRES_DB: newscraft
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      default:
        aliases:
          - newscraft-postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newscraft -d newscraft"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-test:
    image: postgres:18.3-bookworm@sha256:80630f83606d8db77d30b3851b16a9f78be2d0d4dda6f7b82a1fdca5ebe3acba
    restart: "no"
    profiles: ["test"]
    environment:
      POSTGRES_USER: newscraft
      POSTGRES_PASSWORD: newscraft
      POSTGRES_DB: newscraft_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newscraft -d newscraft_test"]
      interval: 2s
      timeout: 2s
      retries: 30

  backup:
    build:
      context: .
      dockerfile: operations/backup.Dockerfile
    image: newscraft-backup:local
    profiles: ["operations"]
    restart: "no"
    environment:
      PGHOST: postgres
      PGUSER: newscraft
      PGPASSWORD: newscraft
      PGDATABASE: newscraft
    volumes:
      - media_data:/data/media:ro
      - export_data:/data/exports:ro
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    image: newscraft-backend:local
    build:
      context: ./backend
    restart: "no"
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://newscraft:newscraft@newscraft-postgres:5432/newscraft
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: newscraft-backend:local
    build:
      context: ./backend
    restart: "no"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+asyncpg://newscraft:newscraft@newscraft-postgres:5432/newscraft
      MEDIA_ROOT: /data/media
      EXPORT_ROOT: /data/exports
      READINESS_REQUIRED_CAPABILITIES: ${READINESS_REQUIRED_CAPABILITIES:-}
      CAPABILITY_QUEUE_CEILING: ${CAPABILITY_QUEUE_CEILING:-1000}
      CAPABILITY_RETRY_AFTER_SECONDS: ${CAPABILITY_RETRY_AFTER_SECONDS:-5}
      CAPABILITY_OBSERVATION_TTL_SECONDS: ${CAPABILITY_OBSERVATION_TTL_SECONDS:-120}
      SECURITY_ADMIN_TOKEN: ${SECURITY_ADMIN_TOKEN:-}
      CODEX_GATEWAY_HASH_KEY: ${CODEX_GATEWAY_HASH_KEY:-}
      CODEX_GATEWAY_PUBLIC_URL: ${CODEX_GATEWAY_PUBLIC_URL:-http://localhost:8000}
      SECRET_KEY_VERSION: ${SECRET_KEY_VERSION:-v1}
      SECRET_MASTER_KEY: ${SECRET_MASTER_KEY:-}
      SECRET_PREVIOUS_KEYS: ${SECRET_PREVIOUS_KEYS:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - media_data:/data/media:ro
      - export_data:/data/exports:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2).close()"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    restart: "no"
    environment:
      API_INTERNAL_BASE_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s

  worker-source-generation:
    image: newscraft-backend:local
    build:
      context: ./backend
    restart: "no"
    command: python -m app.jobs.worker --capability ingestion --capability source --capability generation
    environment:
      NEWSCRAFT_COMPONENT_ID: worker-source-generation
      DATABASE_URL: postgresql+asyncpg://newscraft:newscraft@newscraft-postgres:5432/newscraft
      HTTP_PROXY: ${HTTP_PROXY-}
      HTTPS_PROXY: ${HTTPS_PROXY-}
      ALL_PROXY: ${ALL_PROXY-}
      NO_PROXY: ${NO_PROXY-}
      MEDIA_ROOT: /data/media
      EXPORT_ROOT: /data/exports
      TELEGRAM_MEDIA_STAGING_ROOT: /data/media-staging
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      SECRET_KEY_VERSION: ${SECRET_KEY_VERSION:-v1}
      SECRET_MASTER_KEY: ${SECRET_MASTER_KEY:-}
      SECRET_PREVIOUS_KEYS: ${SECRET_PREVIOUS_KEYS:-}
      SECURITY_INTERNAL_SCOPES: ${SECURITY_INTERNAL_SCOPES:-jobs:read,jobs:write,providers:read,destinations:read}
      TELEGRAM_SOURCE_EDITOR_API_ID: ${TELEGRAM_SOURCE_EDITOR_API_ID:-}
      TELEGRAM_SOURCE_EDITOR_API_HASH: ${TELEGRAM_SOURCE_EDITOR_API_HASH:-}
      TELEGRAM_SOURCE_EDITOR_SESSION: ${TELEGRAM_SOURCE_EDITOR_SESSION:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - media_data:/data/media
      - export_data:/data/exports
      - media_staging:/data/media-staging
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.jobs.healthcheck", "--component-id", "worker-source-generation", "--component-type", "worker", "--expected-capabilities", "generation,ingestion,source", "--expected-job-types", "build_export,content_pack.generate,content_pack.generate_telegram,content_pack.regenerate,execute_retention,ingest.collect,manual_intake,operations.canary.source_generation,research_story,story.group_pending,telegram.route.backfill,telegram.route.dry_run,telegram.route.initialize,telegram.route.poll,telegram.route.process", "--max-age-seconds", "120"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s

  worker-publishing:
    image: newscraft-backend:local
    build:
      context: ./backend
    restart: "no"
    command: python -m app.jobs.worker --capability publishing
    environment:
      NEWSCRAFT_COMPONENT_ID: worker-publishing
      DATABASE_URL: postgresql+asyncpg://newscraft:newscraft@newscraft-postgres:5432/newscraft
      HTTP_PROXY: ${HTTP_PROXY-}
      HTTPS_PROXY: ${HTTPS_PROXY-}
      ALL_PROXY: ${ALL_PROXY-}
      NO_PROXY: ${NO_PROXY-}
      MEDIA_ROOT: /data/media
      SECRET_KEY_VERSION: ${SECRET_KEY_VERSION:-v1}
      SECRET_MASTER_KEY: ${SECRET_MASTER_KEY:-}
      SECRET_PREVIOUS_KEYS: ${SECRET_PREVIOUS_KEYS:-}
      SECURITY_INTERNAL_SCOPES: ${SECURITY_INTERNAL_SCOPES:-jobs:read,jobs:write,providers:read,destinations:read}
      TELEGRAM_PROXY_ALLOWED_PORTS: ${TELEGRAM_PROXY_ALLOWED_PORTS:-80,443,1080,3128,8080,8443}
      TELEGRAM_PROXY_CONNECT_TIMEOUT_SECONDS: ${TELEGRAM_PROXY_CONNECT_TIMEOUT_SECONDS:-10}
      TELEGRAM_API_READ_TIMEOUT_SECONDS: ${TELEGRAM_API_READ_TIMEOUT_SECONDS:-30}
      TELEGRAM_DESTINATION_NEWS_TOKEN: ${TELEGRAM_DESTINATION_NEWS_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - media_data:/data/media:ro
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.jobs.healthcheck", "--component-id", "worker-publishing", "--component-type", "worker", "--expected-capabilities", "publishing", "--expected-job-types", "operations.canary.publishing,telegram.destination.check,telegram.proxy.check,telegram.publish", "--max-age-seconds", "120"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s

  scheduler:
    image: newscraft-backend:local
    build:
      context: ./backend
    restart: "no"
    command: python -m app.jobs.scheduler
    environment:
      NEWSCRAFT_COMPONENT_ID: scheduler
      DATABASE_URL: postgresql+asyncpg://newscraft:newscraft@newscraft-postgres:5432/newscraft
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.jobs.healthcheck", "--component-id", "scheduler", "--component-type", "scheduler", "--expected-capabilities", "scheduling", "--expected-job-types", "", "--max-age-seconds", "90"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s

volumes:
  postgres_data:
  media_data:
  export_data:
  media_staging:
