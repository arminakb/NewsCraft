services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: newscraft
      POSTGRES_PASSWORD: newscraft
      POSTGRES_DB: newscraft
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      default:
        aliases:
          - newscraft-postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newscraft -d newscraft"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-test:
    image: postgres:18
    profiles: ["test"]
    environment:
      POSTGRES_USER: newscraft
      POSTGRES_PASSWORD: newscraft
      POSTGRES_DB: newscraft_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newscraft -d newscraft_test"]
      interval: 2s
      timeout: 2s
      retries: 30

  api:
    image: newscraft-backend:local
    build:
      context: ./backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://newscraft:newscraft@newscraft-postgres:5432/newscraft
      HTTP_PROXY: ${HTTP_PROXY-}
      HTTPS_PROXY: ${HTTPS_PROXY-}
      ALL_PROXY: ${ALL_PROXY-}
      NO_PROXY: ${NO_PROXY-}
      http_proxy: ${http_proxy-}
      https_proxy: ${https_proxy-}
      all_proxy: ${all_proxy-}
      no_proxy: ${no_proxy-}
      MEDIA_ROOT: /data/media
      EXPORT_ROOT: /data/exports
      READINESS_REQUIRED_CAPABILITIES: ${READINESS_REQUIRED_CAPABILITIES:-}
      CAPABILITY_QUEUE_CEILING: ${CAPABILITY_QUEUE_CEILING:-1000}
      CAPABILITY_RETRY_AFTER_SECONDS: ${CAPABILITY_RETRY_AFTER_SECONDS:-5}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      TELEGRAM_SOURCE_EDITOR_API_ID: ${TELEGRAM_SOURCE_EDITOR_API_ID:-}
      TELEGRAM_SOURCE_EDITOR_API_HASH: ${TELEGRAM_SOURCE_EDITOR_API_HASH:-}
      TELEGRAM_SOURCE_EDITOR_SESSION: ${TELEGRAM_SOURCE_EDITOR_SESSION:-}
      TELEGRAM_DESTINATION_NEWS_TOKEN: ${TELEGRAM_DESTINATION_NEWS_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - media_data:/data/media
      - export_data:/data/exports
      - .:/workspace
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2).close()"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    environment:
      API_INTERNAL_BASE_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

  worker-source-generation:
    image: newscraft-backend:local
    build:
      context: ./backend
    command: python -m app.jobs.worker --capability ingestion --capability source --capability generation
    environment:
      NEWSCRAFT_COMPONENT_ID: worker-source-generation
      DATABASE_URL: postgresql+asyncpg://newscraft:newscraft@newscraft-postgres:5432/newscraft
      HTTP_PROXY: ${HTTP_PROXY-}
      HTTPS_PROXY: ${HTTPS_PROXY-}
      ALL_PROXY: ${ALL_PROXY-}
      NO_PROXY: ${NO_PROXY-}
      http_proxy: ${http_proxy-}
      https_proxy: ${https_proxy-}
      all_proxy: ${all_proxy-}
      no_proxy: ${no_proxy-}
      MEDIA_ROOT: /data/media
      EXPORT_ROOT: /data/exports
      TELEGRAM_MEDIA_STAGING_ROOT: /data/media-staging
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      TELEGRAM_SOURCE_EDITOR_API_ID: ${TELEGRAM_SOURCE_EDITOR_API_ID:-}
      TELEGRAM_SOURCE_EDITOR_API_HASH: ${TELEGRAM_SOURCE_EDITOR_API_HASH:-}
      TELEGRAM_SOURCE_EDITOR_SESSION: ${TELEGRAM_SOURCE_EDITOR_SESSION:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - media_data:/data/media
      - export_data:/data/exports
      - media_staging:/data/media-staging
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.jobs.healthcheck", "--component-type", "worker", "--max-age-seconds", "120"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s

  worker-publishing:
    image: newscraft-backend:local
    build:
      context: ./backend
    command: python -m app.jobs.worker --capability publishing
    environment:
      NEWSCRAFT_COMPONENT_ID: worker-publishing
      DATABASE_URL: postgresql+asyncpg://newscraft:newscraft@newscraft-postgres:5432/newscraft
      HTTP_PROXY: ${HTTP_PROXY-}
      HTTPS_PROXY: ${HTTPS_PROXY-}
      ALL_PROXY: ${ALL_PROXY-}
      NO_PROXY: ${NO_PROXY-}
      http_proxy: ${http_proxy-}
      https_proxy: ${https_proxy-}
      all_proxy: ${all_proxy-}
      no_proxy: ${no_proxy-}
      MEDIA_ROOT: /data/media
      TELEGRAM_MEDIA_STAGING_ROOT: /data/media-staging
      TELEGRAM_DESTINATION_NEWS_TOKEN: ${TELEGRAM_DESTINATION_NEWS_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - media_data:/data/media
      - media_staging:/data/media-staging
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.jobs.healthcheck", "--component-type", "worker", "--max-age-seconds", "120"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s

  scheduler:
    image: newscraft-backend:local
    build:
      context: ./backend
    command: python -m app.jobs.scheduler
    environment:
      NEWSCRAFT_COMPONENT_ID: scheduler
      DATABASE_URL: postgresql+asyncpg://newscraft:newscraft@newscraft-postgres:5432/newscraft
      HTTP_PROXY: ${HTTP_PROXY-}
      HTTPS_PROXY: ${HTTPS_PROXY-}
      ALL_PROXY: ${ALL_PROXY-}
      NO_PROXY: ${NO_PROXY-}
      http_proxy: ${http_proxy-}
      https_proxy: ${https_proxy-}
      all_proxy: ${all_proxy-}
      no_proxy: ${no_proxy-}
      MEDIA_ROOT: /data/media
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - media_data:/data/media
      - media_staging:/data/media-staging
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.jobs.healthcheck", "--component-type", "scheduler", "--max-age-seconds", "90"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s

volumes:
  postgres_data:
  media_data:
  export_data:
  media_staging:
