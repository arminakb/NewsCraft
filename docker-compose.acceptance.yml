services:
  backup:
    restart: "no"
  postgres:
    restart: "no"

  postgres-test:
    restart: "no"

  migrate:
    restart: "no"

  api:
    restart: "no"
    environment:
      APP_ENV: test
      SECRET_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

  frontend:
    restart: "no"

  worker-source-generation:
    restart: "no"
    environment:
      APP_ENV: test
      SECRET_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      TELEGRAM_ACCEPTANCE_FIXTURE_PATH: /acceptance-fixtures/telegram_public_album.html
    volumes:
      - ./backend/tests/fixtures:/acceptance-fixtures:ro

  worker-publishing:
    restart: "no"
    environment:
      APP_ENV: test
      SECRET_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      TELEGRAM_ACCEPTANCE_FIXTURE_PATH: /acceptance-fixtures/telegram_public_album.html
    volumes:
      - ./backend/tests/fixtures:/acceptance-fixtures:ro

  scheduler:
    restart: "no"
