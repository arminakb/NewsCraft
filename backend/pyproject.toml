[project]
name = "newscraft-backend"
version = "0.1.0"
description = "PostgreSQL-backed ingestion backend for NewsCraft"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic>=1.16",
  "asyncpg>=0.30",
  "beautifulsoup4>=4.13",
  "ddgs>=9.0,<10",
  "fastapi>=0.128",
  "feedparser>=6.0",
  "httpx[socks]>=0.28",
  "idna>=3.18,<4",
  "jsonschema>=4.23",
  "lxml>=6.0",
  "markdown>=3.8",
  "nh3>=0.3",
  "pydantic-settings>=2.10",
  "python-socks[asyncio]>=2.7,<3",
  "python-dateutil>=2.9",
  "sqlalchemy>=2.0",
  "telethon>=1.40,<2",
  "tldextract>=5.3.1,<6",
  "trafilatura>=2.0",
  "uvicorn[standard]>=0.35",
]

[dependency-groups]
dev = [
  "mypy>=1.18,<2",
  "packaging>=25,<27",
  "pip-audit>=2.9,<3",
  "pytest>=8.4",
  "pytest-asyncio>=1.0",
  "pytest-cov>=7,<8",
  "ruff>=0.13",
]

[build-system]
requires = ["setuptools>=82"]
build-backend = "setuptools.build_meta"

[tool.uv]
required-version = "==0.11.29"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
consider_namespace_packages = true

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
files = [
  "app/core/config.py",
  "app/core/outbound_proxy.py",
  "app/core/redaction.py",
  "app/core/secrets.py",
  "app/jobs/types.py",
  "../scripts/backup_restore.py",
  "../scripts/dependency_inventory.py",
]
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
pretty = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_configs = true
