[project]
name = "newscraft-backend"
version = "0.1.0"
description = "PostgreSQL-backed ingestion backend for NewsCraft"
requires-python = ">=3.14"
dependencies = [
  "alembic>=1.16",
  "asyncpg>=0.30",
  "beautifulsoup4>=4.13",
  "fastapi>=0.128",
  "feedparser>=6.0",
  "httpx[socks]>=0.28",
  "lxml>=6.0",
  "pydantic-settings>=2.10",
  "python-dateutil>=2.9",
  "sqlalchemy>=2.0",
  "trafilatura>=2.0",
  "uvicorn[standard]>=0.35",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4",
  "pytest-asyncio>=1.0",
  "ruff>=0.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
