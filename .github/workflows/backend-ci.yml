name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: newscraft
          POSTGRES_PASSWORD: newscraft
          POSTGRES_DB: newscraft
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U newscraft -d newscraft"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://newscraft:newscraft@localhost:5432/newscraft
      TEST_DATABASE_URL: postgresql+asyncpg://newscraft:newscraft@localhost:5432/newscraft
      ENRICHMENT_PROVIDER: none
      LLM_PROVIDER: none
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: python -m pip install -e ".[dev]"
      - name: Upgrade database
        run: alembic upgrade head
      - name: Ruff
        run: ruff check --no-cache .
      - name: Test
        run: python -m pytest -p no:cacheprovider -q
      - name: Verify one Alembic head
        shell: bash
        run: |
          heads="$(alembic heads)"
          test "$(printf '%s\n' "$heads" | sed '/^[[:space:]]*$/d' | wc -l)" -eq 1
          printf '%s\n' "$heads" | grep -F "0016_persian_llm_generation (head)"
